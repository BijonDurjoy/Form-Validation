<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Form Validator</title>
  </head>
  <body>
    <form id="form">
      <h1>Welcome to the Form</h1>
      <div class="input-group">
        <label for="username">Username : </label>
        <input
          type="text"
          id="username"
          placeholder="Enter username"
          required
        />
        <small id="username-error"></small>
      </div>

      <div class="input-group">
        <label for="password">Password : </label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        />
        <small id="input-error"></small>
      </div>

      <div class="input-group">
        <label for="cnf-password">Confirm Password : </label>
        <input
          type="password"
          id="cnf-password"
          placeholder="Confirm password"
          required
        />
        <small id="cnf-password-error"></small>
      </div>

      <div class="input-group">
        <label for="phoneno">Phone No : </label>
        <input type="text" id="phoneno" placeholder="Enter phone no" />
        <small id="phoneno-error"></small>
      </div>

      <div class="input-group">
        <label for="age">Age : </label>
        <input type="number" id="age" placeholder="Enter your age" required />
        <small id="age-error"></small>
      </div>

      <button type="submit">Submit</button>
    </form>
    <script src="script.js"></script>
  </body>
</html>
